<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:256px;height:256px}
  body{background:transparent;display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces",serif}
  .tile{width:256px;height:256px;border-radius:56px;position:relative;
    background:
      radial-gradient(150px 120px at 30% 22%, rgba(65,224,208,0.16), transparent 60%),
      #0c0f14;
    border:1px solid rgba(90,120,135,0.35);
    display:flex;align-items:center;justify-content:center}
  .A{font-weight:600;font-size:150px;line-height:1;color:#f2f6fb;margin-top:-6px}
  .cursor{position:absolute;right:60px;bottom:62px;width:20px;height:20px;border-radius:4px;
    background:linear-gradient(180deg,#5cead9,#2fb6a9);
    box-shadow:0 0 16px rgba(65,224,208,0.6)}
</style>
</head>
<body>
  <div class="tile">
    <span class="A">A</span>
    <span class="cursor"></span>
  </div>
</body>
</html>
