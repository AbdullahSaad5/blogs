<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:500px;height:125px}
  body{background:transparent;display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces",serif}
  .mark{display:flex;align-items:center;gap:14px}
  .word{font-weight:600;font-size:58px;letter-spacing:-0.01em;line-height:1;
    color:var(--txt,#f2f6fb)}
  .cursor{width:15px;height:46px;border-radius:3px;
    background:linear-gradient(180deg,#5cead9,#2fb6a9);
    box-shadow:0 0 14px rgba(65,224,208,0.55)}
</style>
</head>
<body>
  <div class="mark">
    <span class="word">Abdullah&nbsp;Saad</span>
    <span class="cursor"></span>
  </div>
</body>
</html>
