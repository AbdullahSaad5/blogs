<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:840px}
body{background:#f4f1ea;position:relative;overflow:hidden;font-family:"Fraunces",Georgia,serif;padding:100px 120px}
.brace{position:absolute;font-family:"Fraunces",serif;font-weight:400;font-size:1050px;color:rgba(30,27,22,0.04);right:60px;top:-300px;line-height:1;letter-spacing:60px}
.kick{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:26px;letter-spacing:.26em;color:#9a948a;text-transform:uppercase}
.krule{width:80px;height:5px;background:#c2a03a;margin-top:20px;margin-bottom:52px}
.title{position:relative;z-index:2;font-weight:700;font-size:92px;line-height:1.13;letter-spacing:-1px;color:#1e1b16;max-width:1300px}
.gold{color:#bf9229;font-style:italic}
.foot{position:absolute;left:120px;right:120px;bottom:72px;display:flex;justify-content:space-between;align-items:baseline}
.name{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:27px;color:#1e1b16;letter-spacing:.02em}
.tag{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:25px;color:#9a948a}
</style></head><body>
<div class="brace">{ }</div>
<div class="kick">AI Agents &nbsp;·&nbsp; Document Generation</div>
<div class="krule"></div>
<div class="title">I built an abstraction so my agent could write documents. <span class="gold">Then I deleted it.</span></div>
<div class="foot"><span class="name">Syed Abdullah Saad</span><span class="tag">fewer tokens &ne; better design</span></div>
</body></html>
