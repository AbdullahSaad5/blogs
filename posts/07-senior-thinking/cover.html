<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --ink:#e8edf4;
    --gold:#d8b45f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2000px;height:840px}
  body{
    background:
      radial-gradient(1100px 680px at 78% 36%, rgba(216,180,95,0.08), transparent 60%),
      radial-gradient(760px 520px at 68% 96%, rgba(201,162,74,0.09), transparent 62%),
      radial-gradient(900px 600px at 8% 92%, rgba(40,70,90,0.16), transparent 60%),
      #0a0c11;
    color:var(--ink);
    font-family:"Fraunces",serif;
    overflow:hidden;position:relative;
  }
  .grid{
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(120,140,160,0.09) 1.1px, transparent 1.2px);
    background-size:32px 32px;
    mask-image:linear-gradient(95deg, #000 30%, transparent 90%);
    -webkit-mask-image:linear-gradient(95deg, #000 30%, transparent 90%);
  }
  .frame{position:absolute;inset:46px;border:1px solid rgba(120,150,170,0.16);border-radius:4px}
  .wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 140px}

  .left{max-width:980px}
  .eyebrow{
    font-family:"JetBrains Mono",monospace;font-weight:500;
    font-size:21px;letter-spacing:0.42em;text-transform:uppercase;
    color:var(--gold);opacity:0.92;margin-bottom:32px;
  }
  .eyebrow .dot{color:#46566a;margin:0 14px}
  h1{font-weight:600;font-size:102px;line-height:0.97;letter-spacing:-0.014em;color:#f2f6fb}
  h1 .accent{
    display:block;font-weight:500;
    -webkit-text-fill-color:transparent;
    background:linear-gradient(92deg,#e8cf8f,#c9a24a 78%);
    -webkit-background-clip:text;background-clip:text;margin-top:10px;
  }
  .meta{
    margin-top:42px;font-family:"JetBrains Mono",monospace;font-weight:400;
    font-size:23px;letter-spacing:0.01em;color:#93a1b3;
  }
  .meta b{color:#c6d0dc;font-weight:500}
  .meta .bar{color:#3c4a5c;margin:0 15px}

  .byline{
    position:absolute;left:140px;bottom:74px;
    font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:0.06em;color:#5d6b7d;
  }
  .byline span{color:var(--gold);opacity:0.8}

  /* ---- art: the eleven-habit spec sheet (technical plate) ---- */
  .art{position:relative;width:560px;height:640px;flex:none}
  .art::before{
    content:"";position:absolute;left:60px;top:110px;width:440px;height:380px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(216,180,95,0.09), transparent 70%);
    filter:blur(18px);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="wrap">
    <div class="left">
      <div class="eyebrow">Thinking<span class="dot">/</span>Beyond</div>
      <h1>How to think like<span class="accent">a senior developer.</span></h1>
      <div class="meta"><b>eleven habits</b><span class="bar">·</span><b>learned the hard way</b></div>
    </div>

    <div class="art">
      <svg width="560" height="460" viewBox="0 0 560 460" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- spec sheet -->
        <rect x="70" y="28" width="420" height="392" rx="3" fill="rgba(85,104,138,0.05)" stroke="#55688a" stroke-width="1.8"/>
        <!-- header -->
        <text x="90" y="60" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="3" fill="#7d8ba3">THE HABIT · ELEVEN PARTS</text>
        <text x="470" y="60" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#d8b45f">11/11</text>
        <line x1="90" y1="72" x2="470" y2="72" stroke="#d8b45f" stroke-width="2"/>
        <!-- eleven checked habits -->
        <path d="M90 109 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="116" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">ASK THE QUESTION</text>
        <path d="M90 134 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="141" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">REVISIT THE UNIT OF WORK</text>
        <path d="M90 159 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="166" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">MULTIPLY THE DESIGN</text>
        <path d="M90 184 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="191" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">TRACE THE WORKFLOW</text>
        <path d="M90 209 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="216" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">PUT RISKS IN THE PLAN</text>
        <path d="M90 234 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="241" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">PLAN BEFORE EXECUTE</text>
        <path d="M90 259 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="266" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">KNOW WHO YOU'RE ACTING FOR</text>
        <path d="M90 284 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="291" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">LIST THE UNSEEN CASES</text>
        <path d="M90 309 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="316" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">AUDIT AS AN OUTSIDER</text>
        <path d="M90 334 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="341" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#93a1b3">VERIFY THE OUTPUT</text>
        <path d="M90 359 l4 4 l9 -10" stroke="#d8b45f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="114" y="366" font-family="JetBrains Mono, monospace" font-size="13.5" letter-spacing="1.5" fill="#d8b45f">DESIGN FOR FAILURE</text>
        <!-- caption -->
        <text x="280" y="448" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="4.5" fill="#d8b45f">EACH ONE LEARNED THE HARD WAY</text>
      </svg>
    </div>
  </div>

  <div class="byline">Syed <span>Abdullah</span> Saad</div>
</body>
</html>
