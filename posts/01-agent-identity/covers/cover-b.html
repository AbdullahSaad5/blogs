<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:420px;overflow:hidden}
body{background:#0b0e14;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  color:#e6edf3;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 4px);opacity:.4}
.bar{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#00e5ff,#ff2d55)}
.eye{font:600 14px/1 "Fira Code Nerd Font Mono",ui-monospace,monospace;letter-spacing:.36em;color:#7d8590;margin-bottom:14px;z-index:2}
h1{position:relative;z-index:2;font-weight:800;font-size:118px;letter-spacing:-.04em;line-height:.9;
  text-shadow:3px 0 #ff2d55cc,-3px 0 #00e5ffcc}
.sub{z-index:2;margin-top:22px;font:500 19px/1.4 -apple-system,system-ui,sans-serif;color:#aeb6c2;text-align:center}
.term{z-index:2;margin-top:24px;font:600 15px/1 "Fira Code Nerd Font Mono",ui-monospace,monospace;
  color:#7ee787;background:#11161f;border:1px solid #232a35;border-radius:8px;padding:10px 16px}
.term .id{color:#d2a8ff}.term .x{color:#f85149}
</style></head><body>
<div class="scan"></div><div class="bar"></div>
<div class="eye">AI AGENTS · IDENTITY</div>
<h1>which account?</h1>
<div class="sub">The hardest part of an agent that takes real actions<br>isn't the integrations. It's remembering who it's working for.</div>
<div class="term">$ agent create apex-trigger --on <span class="id">salesforce-1</span> &nbsp;<span class="x">→ wrong org</span></div>
</body></html>
